<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">Abstract intelligent systems visualization</title>
<desc id="desc">Minimal dark visualization of connected systems, data flow and machine learning signals.</desc>
